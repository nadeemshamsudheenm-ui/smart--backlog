<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Student Registration')}"></head>
<body>

<div class="auth-wrapper py-5">
    <div class="auth-card auth-card-wide">
        <!-- Logo & Title -->
        <div class="text-center mb-4">
            <div class="brand-icon-box mx-auto mb-3">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="fw-bold mb-1 text-dark">Student Registration</h3>
            <p class="text-muted small">Register for B.Tech Supplementary Preparation & Backlog Clearance</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-octagon-fill"></i>
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${studentDto}" method="post">
            <div class="row g-3">
                <!-- Personal Info -->
                <div class="col-md-6">
                    <label for="fullName" class="form-label small fw-semibold">Full Name *</label>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="e.g. Rahul Sharma" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="col-md-6">
                    <label for="registerNumber" class="form-label small fw-semibold">University Register Number *</label>
                    <input type="text" class="form-control" id="registerNumber" th:field="*{registerNumber}" placeholder="e.g. TVE21CS055" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('registerNumber')}" th:errors="*{registerNumber}"></div>
                </div>

                <div class="col-md-6">
                    <label for="username" class="form-label small fw-semibold">Portal Username *</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Choose a username" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="col-md-6">
                    <label for="password" class="form-label small fw-semibold">Password *</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="At least 6 characters" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label small fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="student@example.edu">
                </div>

                <div class="col-md-6">
                    <label for="phone" class="form-label small fw-semibold">Contact Phone Number</label>
                    <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="+91 9876543210">
                </div>

                <!-- Academic Classification -->
                <div class="col-12"><hr class="my-2"></div>
                <div class="col-12">
                    <h6 class="fw-bold text-dark mb-0"><i class="bi bi-mortarboard me-1 text-primary"></i> Academic Classification</h6>
                </div>

                <div class="col-md-6">
                    <label for="schemeId" class="form-label small fw-semibold">Academic Regulations Scheme *</label>
                    <select class="form-select" id="schemeId" th:field="*{schemeId}" required>
                        <option value="" disabled selected>-- Select University Scheme --</option>
                        <option th:each="sch : ${schemes}" th:value="${sch.id}" th:text="${sch.name}">2019 Scheme</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="semesterId" class="form-label small fw-semibold">Current Semester *</label>
                    <select class="form-select" id="semesterId" th:field="*{semesterId}" required>
                        <option value="" disabled selected>-- Select Semester --</option>
                        <option th:each="sem : ${semesters}" th:value="${sem.id}" th:text="${sem.name}">Semester 3 (S3)</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label small fw-semibold">Supplementary (Backlog) Subjects To Clear</label>
                    <p class="text-muted small mb-2">Select the subjects you currently have backlogs in. You can update this later in your profile.</p>
                    <div class="border rounded p-3 bg-light" style="max-height: 180px; overflow-y: auto;">
                        <div class="row g-2">
                            <div class="col-md-6" th:each="sub : ${subjects}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           th:value="${sub.id}" 
                                           th:field="*{supplementarySubjectIds}" 
                                           th:id="'sub_' + ${sub.id}">
                                    <label class="form-check-label small" th:for="'sub_' + ${sub.id}">
                                        <strong th:text="${sub.code}">CST201</strong> - 
                                        <span th:text="${sub.name}">Data Structures</span>
                                        <span class="text-muted" style="font-size: 0.72rem;" th:text="'(' + ${sub.scheme.name} + ')'"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mt-4">
                <i class="bi bi-check2-circle me-1"></i> Register Student Account
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">Already registered? </span>
            <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none small">Login Here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
