<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Academic Subjects Management')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="dashboard-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar('subjects')}"></aside>

    <main class="main-content">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
            <div>
                <h3 class="fw-bold mb-1 text-dark">Academic Subjects & Schemes</h3>
                <p class="text-muted small mb-0">Configure B.Tech curriculum subjects mapped to 2019 and 2024 university regulations</p>
            </div>
            <button class="btn btn-primary-custom btn-sm" data-bs-toggle="modal" data-bs-target="#createSubjectModal">
                <i class="bi bi-plus-circle me-1"></i> Add New Subject
            </button>
        </div>

        <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}">Success message</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-octagon-fill"></i>
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <!-- Filter Bar -->
        <div class="content-card mb-4">
            <div class="content-card-body py-3">
                <form th:action="@{/admin/subjects}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <select name="schemeId" class="form-select form-select-sm">
                            <option value="">-- All University Schemes --</option>
                            <option th:each="sch : ${schemes}" 
                                    th:value="${sch.id}" 
                                    th:text="${sch.name}"
                                    th:selected="${selectedSchemeId != null and selectedSchemeId == sch.id}">2019 Scheme</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <select name="semesterId" class="form-select form-select-sm">
                            <option value="">-- All Semesters (S1 - S8) --</option>
                            <option th:each="sem : ${semesters}" 
                                    th:value="${sem.id}" 
                                    th:text="${sem.name}"
                                    th:selected="${selectedSemesterId != null and selectedSemesterId == sem.id}">Semester 1</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm flex-fill">Filter</button>
                        <a th:href="@{/admin/subjects}" class="btn btn-outline-secondary btn-sm">Reset</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Subjects Table -->
        <div class="content-card">
            <div class="table-responsive">
                <table class="table custom-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Subject Name</th>
                            <th>Scheme</th>
                            <th>Semester</th>
                            <th>Department</th>
                            <th>Credits</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${subjects}">
                            <td><strong class="text-primary" th:text="${s.code}">CST201</strong></td>
                            <td>
                                <strong class="text-dark d-block" th:text="${s.name}">Data Structures</strong>
                                <small class="text-muted" th:text="${s.description != null ? s.description : ''}">Description</small>
                            </td>
                            <td><span class="badge badge-scheme" th:text="${s.scheme.name}">2019 Scheme</span></td>
                            <td><span class="badge badge-semester" th:text="${s.semester.code}">S3</span></td>
                            <td class="text-muted small" th:text="${s.department}">CSE</td>
                            <td th:text="${s.credits}">4</td>
                            <td>
                                <form th:action="@{/admin/subjects/delete/{id}(id=${s.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this subject? Note: this will fail if study materials or students are linked.');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create Subject Modal -->
        <div class="modal fade" id="createSubjectModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/admin/subjects/create}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold">Add Academic Subject</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label small fw-semibold">Subject Code *</label>
                                    <input type="text" class="form-control" name="code" placeholder="e.g. CST201" required>
                                </div>
                                <div class="col-md-7">
                                    <label class="form-label small fw-semibold">Credits *</label>
                                    <input type="number" class="form-control" name="credits" value="4" min="1" max="6" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Subject Title *</label>
                                    <input type="text" class="form-control" name="name" placeholder="e.g. Data Structures" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Regulations Scheme *</label>
                                    <select class="form-select" name="schemeId" required>
                                        <option th:each="sch : ${schemes}" th:value="${sch.id}" th:text="${sch.name}">2019 Scheme</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Semester *</label>
                                    <select class="form-select" name="semesterId" required>
                                        <option th:each="sem : ${semesters}" th:value="${sem.id}" th:text="${sem.name}">Semester 3</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Department</label>
                                    <input type="text" class="form-control" name="department" value="Computer Science and Engineering">
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Brief Syllabus / Module Overview</label>
                                    <textarea class="form-control" name="description" rows="2" placeholder="Key topics covered..."></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary-custom btn-sm">Save Subject</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
