<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Server Error (500)')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="stat-icon stat-icon-danger mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
        <i class="bi bi-bug-fill"></i>
    </div>
    <h2 class="fw-bold text-dark mb-2">500 - Server Error</h2>
    <p class="text-muted mb-4">
        An unexpected error occurred while processing your request. Please try again or return to the dashboard.
    </p>
    <a th:href="@{/}" class="btn btn-primary-custom px-4">
        <i class="bi bi-arrow-clockwise me-1"></i> Return to Home
    </a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
