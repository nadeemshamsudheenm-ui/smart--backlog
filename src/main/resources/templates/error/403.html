<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Access Denied (403)')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="stat-icon stat-icon-danger mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h2 class="fw-bold text-dark mb-2">403 - Access Denied</h2>
    <p class="text-muted mb-4">
        You do not have permission to access this resource. Please log in with an authorized account or contact your system administrator.
    </p>
    <a th:href="@{/}" class="btn btn-primary-custom px-4">
        <i class="bi bi-house-door-fill me-1"></i> Return to Your Dashboard
    </a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
